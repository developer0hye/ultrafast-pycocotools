name: Upstream integrations

# Builds this revision of ultrafast-pycocotools into RF-DETR and Ultralytics
# environments and runs both projects' evaluator paths against pycocotools.
# Called with pinned upstream commits by ci.yml (required) and with the latest
# upstream revisions by upstream-canary.yml (weekly, non-blocking).

on:
  workflow_call:
    inputs:
      rfdetr-repository:
        type: string
        default: roboflow/rf-detr
      rfdetr-ref:
        type: string
        required: true
      ultralytics-repository:
        type: string
        required: true
      ultralytics-ref:
        type: string
        required: true

permissions:
  contents: read

env:
  MATURIN_PEP517_ARGS: --locked
  RAYON_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONUTF8: '1'
  MPLBACKEND: Agg
  CUDA_VISIBLE_DEVICES: ''

jobs:
  rfdetr:
    name: RF-DETR integration (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RFDETR_SKIP_DINOV2_PREWARM: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.rfdetr-repository }}
          ref: ${{ inputs.rfdetr-ref }}
          path: upstream/rf-detr
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install CPU framework, RF-DETR and this revision
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.13.0" "torchvision==0.28.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "./upstream/rf-detr[train]" "torchmetrics==1.8.2" "faster-coco-eval==1.8.0" \
            "hotcoco==1.0.1" "transformers==5.17.0" "supervision==0.30.5" "pytorch_lightning==2.6.6" \
            "pycocotools==2.0.11" "pytest==9.1.1" "pytest-doctestplus==1.7.1" "pytest-timeout==2.4.0" \
            "pytest-rerunfailures==14.0" pandas "fuse-augmentations==0.10.0.dev0"
          # rfdetr[train] pulls the released wheel; test this revision instead.
          python -m pip install --no-deps --force-reinstall .
          python scripts/check_integration_build.py rfdetr
      - name: This repository's RF-DETR adapter tests
        run: python -m pytest -q tests/test_rfdetr_integration.py --junitxml=rfdetr-adapter-tests.xml
      - name: RF-DETR's own COCO metric and evaluation callback tests
        working-directory: upstream/rf-detr
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/training/test_coco_map.py
          tests/training/callbacks/test_coco_eval_callback.py
          tests/training/test_build_trainer.py
          --junitxml=${{ github.workspace }}/rfdetr-upstream-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rfdetr-integration-reports
          path: rfdetr-*-tests.xml
          retention-days: 14

  ultralytics:
    name: Ultralytics integration (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only the pinned assets fetched below are used.
      YOLO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.ultralytics-repository }}
          ref: ${{ inputs.ultralytics-ref }}
          path: upstream/ultralytics
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install CPU framework, Ultralytics and this revision
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.13.0" "torchvision==0.28.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ./upstream/ultralytics "pycocotools==2.0.11" "pytest==9.1.1"
          # Ultralytics pulls the released wheel; test this revision instead.
          python -m pip install --no-deps --force-reinstall .
          python scripts/check_integration_build.py ultralytics
      - name: Fetch pinned coco8 datasets and YOLO26 weights
        run: |
          assets="$RUNNER_TEMP/ultralytics"
          mkdir -p "$assets/config" "$assets/datasets" "$assets/work"
          echo "YOLO_CONFIG_DIR=$assets/config" >> "$GITHUB_ENV"
          echo "ULTRALYTICS_WORK=$assets/work" >> "$GITHUB_ENV"
          fetch() {
            curl -sSfL --retry 3 -o "$2" "$1"
            echo "$3  $2" | sha256sum -c -
          }
          datasets=https://github.com/ultralytics/assets/releases/download/v0.0.0
          weights=https://github.com/ultralytics/assets/releases/download/v8.4.0
          cd "$assets"
          fetch "$datasets/coco8.zip" coco8.zip 54c67fe9ef88313e021ec0e92b73c200167bb0a86633e8df8658d832cca828c9
          fetch "$datasets/coco8-seg.zip" coco8-seg.zip 82c651abd01d556c77769ea834ebff1e77f76a291463e987fb69b63a87e8eb80
          fetch "$datasets/coco8-pose.zip" coco8-pose.zip 468e06839e06eaf317594386967d238af4bdfde670e33d9a2a287412b6a37de5
          fetch "$weights/yolo26n.pt" work/yolo26n.pt 9b09cc8bf347f0fc8a5f7657480587f25db09b34bf33b0652110fb03a8ad4fef
          fetch "$weights/yolo26n-seg.pt" work/yolo26n-seg.pt 361fbfabab285c3237700b6bb91d7ecfa602cd945fffda8dbe1242829b71e73f
          fetch "$weights/yolo26n-pose.pt" work/yolo26n-pose.pt eb3bb8268828aeaf515cec23a4bfafd793944a86fe9af94ba7823609c14522a9
          for zip in coco8 coco8-seg coco8-pose; do unzip -q "$zip.zip" -d datasets; done
          cp work/*.pt "$GITHUB_WORKSPACE/upstream/ultralytics/"
          YOLO_CONFIG_DIR="$assets/config" yolo settings datasets_dir="$assets/datasets" sync=False
      - name: Ultralytics validation metrics against pycocotools
        working-directory: ${{ env.ULTRALYTICS_WORK }}
        run: >-
          python -m pytest -q -p no:cacheprovider
          ${{ github.workspace }}/tests/test_ultralytics_integration.py
          --junitxml=${{ github.workspace }}/ultralytics-parity-tests.xml
      - name: Ultralytics' own evaluator integration test
        working-directory: upstream/ultralytics
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_integrations.py::test_ultrafast_pycocotools
          --junitxml=${{ github.workspace }}/ultralytics-upstream-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ultralytics-integration-reports
          path: ultralytics-*-tests.xml
          retention-days: 14
