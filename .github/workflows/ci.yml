name: Library CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: library-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAYON_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONUTF8: '1'
  MPLBACKEND: Agg

jobs:
  python:
    name: Python (${{ matrix.os }}, ${{ matrix.python }}, NumPy ${{ matrix.numpy }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.8', numpy: '1'}
          - {os: ubuntu-24.04-arm, python: '3.12', numpy: '2'}
          - {os: ubuntu-latest, python: '3.9', numpy: '1'}
          - {os: ubuntu-latest, python: '3.12', numpy: '1'}
          - {os: ubuntu-latest, python: '3.12', numpy: '2'}
          - {os: ubuntu-latest, python: '3.14', numpy: '2'}
          - {os: macos-latest, python: '3.12', numpy: '2'}
          - {os: windows-latest, python: '3.12', numpy: '2'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build and install native package with reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,lvis-test]" "numpy>=${{ matrix.numpy }},<${{ matrix.numpy == '1' && '2' || '3' }}" "pycocotools==${{ matrix.python == '3.8' && '2.0.7' || '2.0.11' }}"
          python -c "import ultrafast_pycocotools._ufcoco, pycocotools.cocoeval, lvis, numpy; print('Native extension, COCO and LVIS references imported; NumPy', numpy.__version__)"
      - name: Fetch and verify official LVIS example
        run: python bench/fetch_lvis_fixture.py
      - name: Full API, metric parity and determinism suite
        run: python -m pytest -q --strict-markers --junitxml=test-results.xml
      - name: Generate data and compare scorers in separate processes
        run: python bench/reproduce.py quick --out bench/out/ci-quick
      - name: Compare compact file inputs against the reference
        run: python bench/reproduce.py quick --input-mode files --out bench/out/ci-files
      - name: Check published hashes in the reference environment
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.numpy == '2'
        run: |
          python -m pip install "numpy==2.4.4"
          python bench/reproduce.py quick --out bench/out/ci-published --verify-published quick
      - name: Third-backend benchmark integration
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.numpy == '2'
        run: |
          python -m pip install "faster-coco-eval==1.8.0"
          python bench/reproduce.py quick --out bench/out/ci-three-way --include-faster --verify-published quick
          python -m pytest -q tests/test_faster_lvis_protocol.py
      - name: Retain test reports and reproduction logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}-numpy${{ matrix.numpy }}
          path: |
            test-results.xml
            bench/out/ci-*/*.log
            bench/out/ci-*/comparison.json
          if-no-files-found: ignore
          retention-days: 14

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --locked -p ufcoco-core
      - run: cargo test --locked --release -p ufcoco-core

  rfdetr:
    name: RF-DETR integration (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install pinned CPU framework and RF-DETR revision
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.13.0" "torchvision==0.28.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test]" "numpy==2.4.4" "torchmetrics==1.8.2" "faster-coco-eval==1.8.0" "transformers==5.15.0" "supervision==0.30.0" "pytorch_lightning==2.6.5" "rfdetr[train] @ https://github.com/roboflow/rf-detr/archive/39c2d3a26be81d863abbe84e153445c7813241e5.zip"
          python -c "from rfdetr.training.coco_map import OnePassCocoMeanAveragePrecision; from ultrafast_pycocotools.integrations.rfdetr import use_ultrafast; import torch; assert torch.version.cuda is None"
      - name: RF-DETR metric parity, lifecycle and two-rank Gloo merge
        run: python -m pytest -q tests/test_rfdetr_integration.py --junitxml=rfdetr-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rfdetr-integration-report
          path: rfdetr-tests.xml
          retention-days: 14

  ci:
    name: CI
    if: always()
    needs: [python, rust, rfdetr]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test job to succeed
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          RFDETR_RESULT: ${{ needs.rfdetr.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$RUST_RESULT" = success
          test "$RFDETR_RESULT" = success
